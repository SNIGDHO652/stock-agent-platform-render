[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-agent-platform"
version = "0.1.0"
description = "Agentic stock research backend built with CrewAI, LangGraph, FastAPI, and PostgreSQL for Render free tier."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "crewai>=1.15,<2",
  "fastapi[standard]>=0.139,<0.140",
  "langgraph>=1.2,<2",
  "numpy>=2.2,<3",
  "scipy>=1.14,<2",
  "orjson>=3.10,<4",
  "pandas>=2.3,<3",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25,<26",
  "tenacity>=9,<10",
  "yfinance>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
